server:
  port: ${SERVER_PORT}

spring:
  application:
    name: product-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

jwt:
  secret: ${JWT_SECRET}
