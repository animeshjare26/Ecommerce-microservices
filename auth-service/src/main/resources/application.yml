server:
  port: ${SERVER_PORT}

spring:
  application:
    name: auth-service
  config:
    import: 
      - optional:configserver:${CONFIG_SERVER_URL}
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

jwt:
  refresh:
    secret: ${JWT_REFRESH_SECRET}
    expiration: ${JWT_REFRESH_EXPIRATION} # in minutes
  access:
    secret: ${JWT_ACCESS_SECRET}
    expiration: ${JWT_ACCESS_EXPIRATION} # in minutes

app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}

# Shared secret for service-to-service ("internal") calls. The auth-service stamps this value onto
# its Feign requests to the user-service, and both the user-service and this service's own
# /auth/internal/** endpoints verify it. It MUST be identical across all services. Never commit the
# real value; provide it via the INTERNAL_API_KEY environment variable / .env file.
internal:
  api-key: ${INTERNAL_API_KEY}
